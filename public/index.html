<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Shiptivitas</title>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind config matching Stitch design system -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "background":                "#f8f9ff",
              "on-background":             "#0b1c30",
              "surface":                   "#f8f9ff",
              "surface-dim":               "#cbdbf5",
              "surface-bright":            "#f8f9ff",
              "surface-container-lowest":  "#ffffff",
              "surface-container-low":     "#eff4ff",
              "surface-container":         "#e5eeff",
              "surface-container-high":    "#dce9ff",
              "surface-container-highest": "#d3e4fe",
              "on-surface":                "#0b1c30",
              "on-surface-variant":        "#45464d",
              "inverse-surface":           "#213145",
              "inverse-on-surface":        "#eaf1ff",
              "outline":                   "#76777d",
              "outline-variant":           "#c6c6cd",
              "primary":                   "#000000",
              "on-primary":                "#ffffff",
              "primary-container":         "#131b2e",
              "on-primary-container":      "#7c839b",
              "secondary":                 "#0058be",
              "on-secondary":              "#ffffff",
              "secondary-container":       "#2170e4",
              "on-secondary-container":    "#fefcff",
              "secondary-fixed":           "#d8e2ff",
              "on-secondary-fixed":        "#001a42",
              "on-secondary-fixed-variant":"#004395",
              "tertiary-fixed":            "#6ffbbe",
              "tertiary-fixed-dim":        "#4edea3",
              "on-tertiary-fixed":         "#002113",
              "on-tertiary-fixed-variant": "#005236",
              "on-tertiary-container":     "#009668",
              "tertiary-container":        "#002113",
              "error":                     "#ba1a1a",
              "on-error":                  "#ffffff",
              "error-container":           "#ffdad6",
              "on-error-container":        "#93000a",
              "surface-tint":              "#565e74",
              "surface-variant":           "#d3e4fe",
              "inverse-primary":           "#bec6e0",
              "primary-fixed":             "#dae2fd",
              "primary-fixed-dim":         "#bec6e0",
              "on-primary-fixed":          "#131b2e",
              "on-primary-fixed-variant":  "#3f465c",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg:      "0.5rem",
              xl:      "0.75rem",
              full:    "9999px",
            },
          },
        },
      };
    </script>
    <style>
      * { font-family: 'Inter', sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      /* Dragula mirror & transit */
      .gu-mirror {
        position: fixed !important;
        margin: 0 !important;
        z-index: 9999 !important;
        opacity: 0.85;
        transform: rotate(2deg) scale(1.04);
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15);
        pointer-events: none;
      }
      .gu-transit { opacity: 0.25; }
      /* Lane-specific card colors */
      [data-lane="backlog"]     .kanban-card { background-color: #f8fafc; border-left: 4px solid #94a3b8; }
      [data-lane="in-progress"] .kanban-card { background-color: #eff6ff; border-left: 4px solid #3b82f6; }
      [data-lane="complete"]    .kanban-card { background-color: #f0fdf4; border-left: 4px solid #22c55e; }
      /* Hide scrollbars in lanes */
      .swimlane-scroll { scrollbar-width: none; }
      .swimlane-scroll::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
